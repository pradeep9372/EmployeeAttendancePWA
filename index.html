<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color"
        content="#1a73e8">

  <title>Employee Attendance</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      font-family: Arial, sans-serif;

      background: #f3f6f9;

    }


    .container {

      max-width: 450px;

      margin: 20px auto;

      background: white;

      padding: 25px;

      border-radius: 16px;

      box-shadow:
        0 4px 20px rgba(0,0,0,0.12);

    }


    h2 {

      text-align: center;

      margin-bottom: 25px;

      color: #202124;

    }


    label {

      display: block;

      margin-top: 15px;

      font-weight: bold;

      color: #333;

    }


    input,
    select,
    button {

      width: 100%;

      padding: 14px;

      margin-top: 8px;

      border-radius: 8px;

      border: 1px solid #ccc;

      font-size: 16px;

    }


    input:focus,
    select:focus {

      outline: none;

      border-color: #1a73e8;

    }


    button {

      border: none;

      background: #1a73e8;

      color: white;

      cursor: pointer;

      font-weight: bold;

    }


    button:hover {

      background: #1557b0;

    }


    button:disabled {

      background: #999;

      cursor: not-allowed;

    }


    .location {

      margin-top: 15px;

      padding: 12px;

      border-radius: 8px;

      background: #f1f3f4;

      font-size: 14px;

      line-height: 1.6;

    }


    .employee-info {

      margin-top: 15px;

      padding: 12px;

      border-radius: 8px;

      background: #e8f0fe;

      font-size: 14px;

      line-height: 1.6;

    }


    .success {

      margin-top: 20px;

      padding: 15px;

      background: #d9ead3;

      color: #274e13;

      border-radius: 8px;

      line-height: 1.6;

    }


    .error {

      margin-top: 20px;

      padding: 15px;

      background: #f4cccc;

      color: #990000;

      border-radius: 8px;

      line-height: 1.6;

    }


    .map-button {

      display: inline-block;

      margin-top: 12px;

      padding: 10px 15px;

      background: #188038;

      color: white;

      text-decoration: none;

      border-radius: 7px;

    }


    .map-button:hover {

      background: #137333;

    }


    .checking {

      margin-top: 10px;

      font-size: 14px;

      color: #555;

    }

  </style>

</head>


<body>


<div class="container">


  <h2>📍 Employee Attendance</h2>


  <!-- ================================================= -->
  <!-- EMPLOYEE ID -->
  <!-- ================================================= -->

  <label for="employeeId">
    Employee ID
  </label>


  <input

    type="text"

    id="employeeId"

    placeholder="Example: EMP001"

    autocomplete="off"

    oninput="clearEmployeeInfo()"

  >


  <button

    type="button"

    id="checkEmployeeButton"

    onclick="checkEmployee()">

    🔍 Check Employee

  </button>


  <!-- EMPLOYEE INFORMATION -->

  <div
    id="employeeInfo"
    class="employee-info"
    style="display:none;">

  </div>


  <!-- ================================================= -->
  <!-- ATTENDANCE TYPE -->
  <!-- ================================================= -->

  <label for="type">

    Attendance Type

  </label>


  <select id="type">

    <option value="IN">
      IN
    </option>

    <option value="OUT">
      OUT
    </option>

  </select>


  <!-- ================================================= -->
  <!-- GPS BUTTON -->
  <!-- ================================================= -->

  <button

    type="button"

    id="locationButton"

    onclick="getLocation()">

    📍 Get Current Location

  </button>


  <!-- GPS STATUS -->

  <div

    id="locationStatus"

    class="location">

    Location not captured.

  </div>


  <!-- ================================================= -->
  <!-- SUBMIT -->
  <!-- ================================================= -->

  <button

    type="button"

    id="submitButton"

    onclick="submitAttendance()"

    disabled>

    Submit Attendance

  </button>


  <!-- ================================================= -->
  <!-- MESSAGE -->
  <!-- ================================================= -->

  <div id="message"></div>


</div>



<script>


// =====================================================
// GOOGLE APPS SCRIPT WEB APP URL
// =====================================================

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxD0Ur-QLnBaoq0LPq3N_CumLS7eRyMgZNqIjSAwT9ttwL7F1TASUMMBxlyizKTkFVmMg/exec";


// =====================================================
// GPS VARIABLES
// =====================================================

let latitude = null;

let longitude = null;


// =====================================================
// EMPLOYEE VARIABLE
// =====================================================

let employeeVerified = false;

let verifiedEmployeeId = "";

let verifiedEmployeeName = "";

let verifiedDepartment = "";


// =====================================================
// CLEAR EMPLOYEE INFORMATION
// =====================================================

function clearEmployeeInfo() {

  employeeVerified = false;

  verifiedEmployeeId = "";

  verifiedEmployeeName = "";

  verifiedDepartment = "";

  latitude = null;

  longitude = null;


  document.getElementById(
    "employeeInfo"
  ).style.display = "none";


  document.getElementById(
    "submitButton"
  ).disabled = true;


  document.getElementById(
    "locationStatus"
  ).innerHTML =
    "Location not captured.";

}


// =====================================================
// CHECK EMPLOYEE
// =====================================================

function checkEmployee() {

  const employeeId =
    document.getElementById(
      "employeeId"
    ).value.trim().toUpperCase();


  const message =
    document.getElementById(
      "message"
    );


  const employeeInfo =
    document.getElementById(
      "employeeInfo"
    );


  const button =
    document.getElementById(
      "checkEmployeeButton"
    );


  message.innerHTML = "";


  // -----------------------------------------------
  // CHECK EMPTY ID
  // -----------------------------------------------

  if (!employeeId) {

    message.innerHTML =

      '<div class="error">' +

      '❌ Please enter Employee ID.' +

      '</div>';

    return;

  }


  // -----------------------------------------------
  // DISABLE BUTTON
  // -----------------------------------------------

  button.disabled = true;

  button.innerHTML =
    "⏳ Checking employee...";


  // -----------------------------------------------
  // UNIQUE CALLBACK
  // -----------------------------------------------

  const callbackName =
    "employeeCallback_" +
    Date.now();


  const script =
    document.createElement("script");


  let finished = false;


  // -----------------------------------------------
  // TIMEOUT
  // -----------------------------------------------

  const timeout =
    setTimeout(function() {

      if (finished) {
        return;
      }

      finished = true;

      script.remove();

      delete window[callbackName];


      button.disabled = false;

      button.innerHTML =
        "🔍 Check Employee";


      message.innerHTML =

        '<div class="error">' +

        '❌ Server did not respond. ' +

        'Please check the Apps Script deployment.' +

        '</div>';

    }, 15000);


  // -----------------------------------------------
  // CALLBACK
  // -----------------------------------------------

  window[callbackName] =
    function(result) {

      if (finished) {
        return;
      }

      finished = true;

      clearTimeout(timeout);

      script.remove();

      delete window[callbackName];


      button.disabled = false;

      button.innerHTML =
        "🔍 Check Employee";


      // -------------------------------------------
      // EMPLOYEE FOUND
      // -------------------------------------------

      if (
        result &&
        result.success
      ) {

        employeeVerified = true;

        verifiedEmployeeId =
          result.employeeId;

        verifiedEmployeeName =
          result.employeeName;

        verifiedDepartment =
          result.department;


        employeeInfo.style.display =
          "block";


        employeeInfo.innerHTML =

          "<b>✅ Employee Verified</b>" +

          "<br><br>" +

          "Employee ID: " +

          result.employeeId +

          "<br>" +

          "Employee Name: " +

          result.employeeName +

          "<br>" +

          "Department: " +

          result.department;


        message.innerHTML =

          '<div class="success">' +

          '✅ Employee ID verified. ' +

          'You can now capture your location.' +

          '</div>';

      }


      // -------------------------------------------
      // EMPLOYEE NOT FOUND
      // -------------------------------------------

      else {

        employeeVerified = false;


        employeeInfo.style.display =
          "none";


        document.getElementById(
          "submitButton"
        ).disabled = true;


        message.innerHTML =

          '<div class="error">' +

          '❌ ' +

          (
            result &&
            result.message

              ? result.message

              : "Employee ID not found."
          ) +

          '</div>';

      }

    };


  // -----------------------------------------------
  // API PARAMETERS
  // -----------------------------------------------

  const params =

    "?api=attendance" +

    "&action=employee" +

    "&employeeId=" +

    encodeURIComponent(employeeId) +

    "&callback=" +

    encodeURIComponent(callbackName);


  // -----------------------------------------------
  // SEND REQUEST
  // -----------------------------------------------

  script.src =
    SCRIPT_URL + params;


  script.onerror =
    function() {

      if (finished) {
        return;
      }

      finished = true;

      clearTimeout(timeout);

      script.remove();

      delete window[callbackName];


      button.disabled = false;

      button.innerHTML =
        "🔍 Check Employee";


      message.innerHTML =

        '<div class="error">' +

        '❌ Could not connect to attendance server.' +

        '</div>';

    };


  document.body.appendChild(script);

}


// =====================================================
// GET GPS LOCATION
// =====================================================

function getLocation() {

  const status =
    document.getElementById(
      "locationStatus"
    );


  const message =
    document.getElementById(
      "message"
    );


  // -----------------------------------------------
  // EMPLOYEE CHECK
  // -----------------------------------------------

  if (!employeeVerified) {

    message.innerHTML =

      '<div class="error">' +

      '❌ Please verify Employee ID first.' +

      '</div>';

    return;

  }


  message.innerHTML = "";


  status.innerHTML =
    "📍 Getting your current location...";


  document.getElementById(
    "locationButton"
  ).disabled = true;


  if (!navigator.geolocation) {

    status.innerHTML =

      "❌ GPS is not supported by this browser.";


    document.getElementById(
      "locationButton"
    ).disabled = false;


    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position) {

      latitude =
        position.coords.latitude;

      longitude =
        position.coords.longitude;


      // -------------------------------------------
      // DISPLAY GPS
      // -------------------------------------------

      status.innerHTML =

        "✅ <b>Location captured.</b>" +

        "<br><br>" +

        "Latitude: " +

        latitude.toFixed(6) +

        "<br>" +

        "Longitude: " +

        longitude.toFixed(6);


      document.getElementById(
        "locationButton"
      ).disabled = false;


      // -------------------------------------------
      // ENABLE SUBMIT
      // -------------------------------------------

      document.getElementById(
        "submitButton"
      ).disabled = false;

    },


    function(error) {

      latitude = null;

      longitude = null;


      document.getElementById(
        "locationButton"
      ).disabled = false;


      if (error.code === 1) {

        status.innerHTML =

          "❌ Location permission denied. " +

          "Please allow location access.";

      }

      else if (error.code === 2) {

        status.innerHTML =

          "❌ Location unavailable. " +

          "Please try again.";

      }

      else if (error.code === 3) {

        status.innerHTML =

          "❌ Location request timed out. " +

          "Please try again.";

      }

      else {

        status.innerHTML =

          "❌ Unable to get location.";

      }

    },


    {

      enableHighAccuracy: true,

      timeout: 15000,

      maximumAge: 0

    }

  );

}


// =====================================================
// SUBMIT ATTENDANCE
// =====================================================

function submitAttendance() {

  const employeeId =
    document.getElementById(
      "employeeId"
    ).value.trim().toUpperCase();


  const type =
    document.getElementById(
      "type"
    ).value;


  const message =
    document.getElementById(
      "message"
    );


  // =================================================
  // CHECK EMPLOYEE VERIFICATION
  // =================================================

  if (!employeeVerified) {

    message.innerHTML =

      '<div class="error">' +

      '❌ Please verify Employee ID first.' +

      '</div>';

    return;

  }


  // =================================================
  // CHECK EMPLOYEE ID
  // =================================================

  if (
    employeeId !==
    String(verifiedEmployeeId)
      .trim()
      .toUpperCase()
  ) {

    message.innerHTML =

      '<div class="error">' +

      '❌ Employee ID changed. ' +

      'Please verify the Employee ID again.' +

      '</div>';

    return;

  }


  // =================================================
  // CHECK GPS
  // =================================================

  if (
    latitude === null ||
    longitude === null
  ) {

    message.innerHTML =

      '<div class="error">' +

      '❌ Please capture your location first.' +

      '</div>';

    return;

  }


  // =================================================
  // DISABLE BUTTONS
  // =================================================

  document.getElementById(
    "submitButton"
  ).disabled = true;


  document.getElementById(
    "locationButton"
  ).disabled = true;


  document.getElementById(
    "checkEmployeeButton"
  ).disabled = true;


  message.innerHTML =

    "⏳ Submitting attendance...";


  // =================================================
  // CREATE CALLBACK
  // =================================================

  const callbackName =
    "attendanceCallback_" +
    Date.now();


  const script =
    document.createElement("script");


  let finished = false;


  // =================================================
  // TIMEOUT
  // =================================================

  const timeout =
    setTimeout(function() {

      if (finished) {
        return;
      }

      finished = true;

      script.remove();

      delete window[callbackName];


      message.innerHTML =

        '<div class="error">' +

        '❌ Server did not respond.' +

        '<br><br>' +

        'Please check your Apps Script deployment.' +

        '</div>';


      document.getElementById(
        "submitButton"
      ).disabled = false;


      document.getElementById(
        "locationButton"
      ).disabled = false;


      document.getElementById(
        "checkEmployeeButton"
      ).disabled = false;


    }, 20000);


  // =================================================
  // SERVER CALLBACK
  // =================================================

  window[callbackName] =
    function(result) {

      if (finished) {
        return;
      }


      finished = true;


      clearTimeout(timeout);


      script.remove();

      delete window[callbackName];


      // =================================================
      // SUCCESS
      // =================================================

      if (
        result &&
        result.success
      ) {

        message.innerHTML =

          '<div class="success">' +

          '<b>✅ Attendance submitted successfully!</b>' +

          '<br><br>' +

          'Employee ID: ' +

          result.employeeId +

          '<br>' +

          'Employee: ' +

          result.employeeName +

          '<br>' +

          'Department: ' +

          result.department +

          '<br>' +

          'Type: ' +

          result.type +

          '<br><br>' +

          'Latitude: ' +

          Number(
            result.latitude
          ).toFixed(6) +

          '<br>' +

          'Longitude: ' +

          Number(
            result.longitude
          ).toFixed(6) +

          '<br><br>' +

          '<a class="map-button" ' +

          'href="' +

          result.mapsLink +

          '" ' +

          'target="_blank">' +

          '📍 View Location on Google Maps' +

          '</a>' +

          '</div>';


        // =================================================
        // RESET
        // =================================================

        document.getElementById(
          "employeeId"
        ).value = "";


        document.getElementById(
          "employeeInfo"
        ).style.display = "none";


        document.getElementById(
          "locationStatus"
        ).innerHTML =
          "Location not captured.";


        employeeVerified = false;

        verifiedEmployeeId = "";

        verifiedEmployeeName = "";

        verifiedDepartment = "";

        latitude = null;

        longitude = null;


        document.getElementById(
          "submitButton"
        ).disabled = true;


        document.getElementById(
          "locationButton"
        ).disabled = false;


        document.getElementById(
          "checkEmployeeButton"
        ).disabled = false;

      }


      // =================================================
      // SERVER ERROR
      // =================================================

      else {

        message.innerHTML =

          '<div class="error">' +

          '❌ ' +

          (

            result &&
            result.message

              ? result.message

              : "Attendance submission failed."

          ) +

          '</div>';


        document.getElementById(
          "submitButton"
        ).disabled = false;


        document.getElementById(
          "locationButton"
        ).disabled = false;


        document.getElementById(
          "checkEmployeeButton"
        ).disabled = false;

      }

    };


  // =================================================
  // API URL
  // =================================================

  const params =

    "?api=attendance" +

    "&action=submit" +

    "&employeeId=" +

    encodeURIComponent(
      employeeId
    ) +

    "&type=" +

    encodeURIComponent(
      type
    ) +

    "&latitude=" +

    encodeURIComponent(
      latitude
    ) +

    "&longitude=" +

    encodeURIComponent(
      longitude
    ) +

    "&callback=" +

    encodeURIComponent(
      callbackName
    );


  // =================================================
  // SEND REQUEST
  // =================================================

  script.src =
    SCRIPT_URL + params;


  script.onerror =
    function() {

      if (finished) {
        return;
      }


      finished = true;


      clearTimeout(timeout);


      script.remove();

      delete window[callbackName];


      message.innerHTML =

        '<div class="error">' +

        '❌ Could not connect to attendance server.' +

        '</div>';


      document.getElementById(
        "submitButton"
      ).disabled = false;


      document.getElementById(
        "locationButton"
      ).disabled = false;


      document.getElementById(
        "checkEmployeeButton"
      ).disabled = false;

    };


  document.body.appendChild(script);

}

</script>


</body>

</html>
