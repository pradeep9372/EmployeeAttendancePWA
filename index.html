<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color"
        content="#1a73e8">

  <link rel="manifest"
        href="manifest.json">

  <title>Employee Attendance</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f6f9;
    }

    .container {
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.15);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border-radius: 8px;
      font-size: 16px;
    }

    input,
    select {
      border: 1px solid #ccc;
    }

    button {
      border: none;
      background: #1a73e8;
      color: white;
      cursor: pointer;
      margin-top: 20px;
    }

    button:disabled {
      background: #999;
    }

    .location {
      margin-top: 15px;
      padding: 15px;
      background: #f1f3f4;
      border-radius: 10px;
    }

    .success {
      margin-top: 20px;
      padding: 15px;
      background: #d9ead3;
      border-radius: 10px;
      color: #274e13;
    }

    .error {
      margin-top: 20px;
      padding: 15px;
      background: #f4cccc;
      border-radius: 10px;
      color: #990000;
    }

  </style>

</head>


<body>

<div class="container">

  <h2>📍 Employee Attendance</h2>


  <label>Employee ID</label>

  <input
    type="text"
    id="employeeId"
    placeholder="Enter Employee ID"
    autocomplete="off"
  >


  <label>Attendance Type</label>

  <select id="type">

    <option value="IN">
      IN
    </option>

    <option value="OUT">
      OUT
    </option>

  </select>


  <button
    id="locationButton"
    onclick="getLocation()">

    📍 Get Current Location

  </button>


  <div
    id="locationStatus"
    class="location">

    Location not captured.

  </div>


  <button
    id="submitButton"
    onclick="submitAttendance()"
    disabled>

    Submit Attendance

  </button>


  <div id="message"></div>

</div>


<script>

let latitude = null;
let longitude = null;


// =====================================
// GET LOCATION
// =====================================

function getLocation() {

  const status =
    document.getElementById("locationStatus");

  status.innerHTML =
    "📍 Getting your current location...";


  if (!navigator.geolocation) {

    status.innerHTML =
      "❌ GPS is not supported.";

    return;
  }


  navigator.geolocation.getCurrentPosition(

    function(position) {

      latitude =
        position.coords.latitude;

      longitude =
        position.coords.longitude;


      status.innerHTML =

        "✅ Location captured successfully." +

        "<br><br>" +

        "Latitude: " +

        latitude.toFixed(6) +

        "<br>" +

        "Longitude: " +

        longitude.toFixed(6);


      document.getElementById(
        "submitButton"
      ).disabled = false;

    },


    function(error) {

      let message =
        "❌ Unable to get location.";


      if (error.code === 1) {

        message =
          "❌ Location permission denied.";

      }

      if (error.code === 2) {

        message =
          "❌ Location unavailable.";

      }

      if (error.code === 3) {

        message =
          "❌ Location request timed out.";

      }


      status.innerHTML = message;

    },


    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );

}


// =====================================
// SUBMIT ATTENDANCE
// =====================================

function submitAttendance() {

  const employeeId =
    document.getElementById(
      "employeeId"
    ).value.trim();


  const type =
    document.getElementById(
      "type"
    ).value;


  const message =
    document.getElementById(
      "message"
    );


  if (!employeeId) {

    message.innerHTML =
      '<div class="error">' +
      '❌ Please enter Employee ID.' +
      '</div>';

    return;
  }


  if (latitude === null ||
      longitude === null) {

    message.innerHTML =
      '<div class="error">' +
      '❌ Please capture your location first.' +
      '</div>';

    return;
  }


  message.innerHTML =
    "⏳ Submitting attendance...";


  document.getElementById(
    "submitButton"
  ).disabled = true;


  /*
   * GOOGLE APPS SCRIPT CONNECTION
   *
   * We will add your Apps Script
   * Web App URL in the next step.
   */


  const data = {

    employeeId: employeeId,

    type: type,

    latitude: latitude,

    longitude: longitude

  };


  console.log(data);


  /*
   * TEMPORARY TEST
   */

  setTimeout(function() {

    message.innerHTML =

      '<div class="success">' +

      '<b>✅ GPS data captured</b>' +

      '<br><br>' +

      'Employee ID: ' +

      employeeId +

      '<br>' +

      'Type: ' +

      type +

      '<br><br>' +

      'Latitude: ' +

      latitude.toFixed(6) +

      '<br>' +

      'Longitude: ' +

      longitude.toFixed(6) +

      '</div>';


    document.getElementById(
      "submitButton"
    ).disabled = false;

  }, 1000);

}


// =====================================
// SERVICE WORKER
// =====================================

if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker.register(
        "service-worker.js"
      )
      .then(function() {

        console.log(
          "Service Worker registered"
        );

      })
      .catch(function(error) {

        console.log(
          "Service Worker error:",
          error
        );

      });

    }
  );

}

</script>

</body>

</html>
