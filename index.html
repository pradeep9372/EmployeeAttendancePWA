<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color"
        content="#1a73e8">

  <link rel="manifest"
        href="manifest.json">

  <title>Employee Attendance</title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f6f9;
    }

    .container {
      max-width: 450px;
      margin: 20px auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      border: none;
      background: #1a73e8;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .location {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #f1f3f4;
      font-size: 14px;
    }

    .success {
      margin-top: 20px;
      padding: 15px;
      background: #d9ead3;
      color: #274e13;
      border-radius: 8px;
    }

    .error {
      margin-top: 20px;
      padding: 15px;
      background: #f4cccc;
      color: #990000;
      border-radius: 8px;
    }

    .map-button {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 15px;
      background: #188038;
      color: white;
      text-decoration: none;
      border-radius: 7px;
    }

  </style>

</head>


<body>

<div class="container">

  <h2>📍 Employee Attendance</h2>


  <label>Employee ID</label>

  <input
    type="text"
    id="employeeId"
    placeholder="Example: EMP001"
    autocomplete="off"
  >


  <label>Attendance Type</label>

  <select id="type">

    <option value="IN">IN</option>

    <option value="OUT">OUT</option>

  </select>


  <button
    id="locationButton"
    onclick="getLocation()">

    📍 Get Current Location

  </button>


  <div
    id="locationStatus"
    class="location">

    Location not captured.

  </div>


  <button
    id="submitButton"
    onclick="submitAttendance()"
    disabled>

    Submit Attendance

  </button>


  <div id="message"></div>

</div>


<script>


// =====================================================
// GOOGLE APPS SCRIPT WEB APP URL
// =====================================================

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxD0Ur-QLnBaoq0LPq3N_CumLS7eRyMgZNqIjSAwT9ttwL7F1TASUMMBxlyizKTkFVmMg/exec";


// =====================================================
// GPS VARIABLES
// =====================================================

let latitude = null;
let longitude = null;


// =====================================================
// GET GPS LOCATION
// =====================================================

function getLocation() {

  const status =
    document.getElementById("locationStatus");

  const message =
    document.getElementById("message");

  message.innerHTML = "";

  status.innerHTML =
    "📍 Getting your current location...";


  if (!navigator.geolocation) {

    status.innerHTML =
      "❌ GPS is not supported by this browser.";

    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position) {

      latitude =
        position.coords.latitude;

      longitude =
        position.coords.longitude;


      status.innerHTML =

        "✅ Location captured." +

        "<br><br>" +

        "Latitude: " +
        latitude.toFixed(6) +

        "<br>" +

        "Longitude: " +
        longitude.toFixed(6);


      document.getElementById(
        "submitButton"
      ).disabled = false;

    },


    function(error) {

      latitude = null;
      longitude = null;


      if (error.code === 1) {

        status.innerHTML =
          "❌ Location permission denied. " +
          "Please allow location access.";

      }

      else if (error.code === 2) {

        status.innerHTML =
          "❌ Location unavailable. " +
          "Please try again.";

      }

      else if (error.code === 3) {

        status.innerHTML =
          "❌ Location request timed out. " +
          "Please try again.";

      }

      else {

        status.innerHTML =
          "❌ Unable to get location.";

      }

    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );

}


// =====================================================
// SUBMIT ATTENDANCE
// =====================================================

function submitAttendance() {

  const employeeId =
    document.getElementById(
      "employeeId"
    ).value.trim();


  const type =
    document.getElementById(
      "type"
    ).value;


  const message =
    document.getElementById(
      "message"
    );


  // -----------------------------------------------
  // CHECK EMPLOYEE ID
  // -----------------------------------------------

  if (!employeeId) {

    message.innerHTML =
      '<div class="error">' +
      '❌ Please enter Employee ID.' +
      '</div>';

    return;

  }


  // -----------------------------------------------
  // CHECK LOCATION
  // -----------------------------------------------

  if (
    latitude === null ||
    longitude === null
  ) {

    message.innerHTML =
      '<div class="error">' +
      '❌ Please capture your location first.' +
      '</div>';

    return;

  }


  // -----------------------------------------------
  // DISABLE BUTTONS
  // -----------------------------------------------

  document.getElementById(
    "submitButton"
  ).disabled = true;


  document.getElementById(
    "locationButton"
  ).disabled = true;


  message.innerHTML =
    "⏳ Submitting attendance...";


  // -----------------------------------------------
  // CREATE UNIQUE CALLBACK
  // -----------------------------------------------

  const callbackName =
    "attendanceCallback_" +
    Date.now();


  const script =
    document.createElement("script");


  let finished = false;


  // -----------------------------------------------
  // TIMEOUT PROTECTION
  // -----------------------------------------------

  const timeout =
    setTimeout(function() {

      if (finished) {
        return;
      }

      finished = true;

      script.remove();

      delete window[callbackName];


      message.innerHTML =
        '<div class="error">' +
        '❌ Server did not respond. ' +
        'Please check your Apps Script deployment.' +
        '</div>';


      document.getElementById(
        "submitButton"
      ).disabled = false;


      document.getElementById(
        "locationButton"
      ).disabled = false;

    }, 20000);


  // -----------------------------------------------
  // RESPONSE CALLBACK
  // -----------------------------------------------

  window[callbackName] =
    function(result) {

      if (finished) {
        return;
      }

      finished = true;

      clearTimeout(timeout);

      script.remove();

      delete window[callbackName];


      // -------------------------------------------
      // SUCCESS
      // -------------------------------------------

      if (result && result.success) {

        message.innerHTML =

          '<div class="success">' +

          '<b>✅ Attendance submitted!</b>' +

          '<br><br>' +

          'Employee: ' +
          result.employeeName +

          '<br>' +

          'department: ' +
          result.department +

          '<br><br>' +

          'Latitude: ' +
          Number(result.latitude).toFixed(6) +

          '<br>' +

          'Longitude: ' +
          Number(result.longitude).toFixed(6) +

          '<br><br>' +

          '<a class="map-button" ' +

          'href="' +
          result.mapsLink +
          '" ' +

          'target="_blank">' +

          '📍 View Location' +

          '</a>' +

          '</div>';


        // Reset form

        document.getElementById(
          "employeeId"
        ).value = "";


        latitude = null;
        longitude = null;


        document.getElementById(
          "locationStatus"
        ).innerHTML =
          "Location not captured.";


        document.getElementById(
          "submitButton"
        ).disabled = true;


        document.getElementById(
          "locationButton"
        ).disabled = false;

      }


      // -------------------------------------------
      // SERVER ERROR
      // -------------------------------------------

      else {

        message.innerHTML =

          '<div class="error">' +

          '❌ ' +

          (result && result.message
            ? result.message
            : "Unknown server error.") +

          '</div>';


        document.getElementById(
          "submitButton"
        ).disabled = false;


        document.getElementById(
          "locationButton"
        ).disabled = false;

      }

    };


  // -----------------------------------------------
  // BUILD API URL
  // -----------------------------------------------

  const params =

    "?api=attendance" +

    "&action=submit" +

    "&employeeId=" +
    encodeURIComponent(employeeId) +

    "&type=" +
    encodeURIComponent(type) +

    "&latitude=" +
    encodeURIComponent(latitude) +

    "&longitude=" +
    encodeURIComponent(longitude) +

    "&callback=" +
    encodeURIComponent(callbackName);


  // -----------------------------------------------
  // SEND REQUEST
  // -----------------------------------------------

  script.src =
    SCRIPT_URL + params;


  script.onerror =
    function() {

      if (finished) {
        return;
      }

      finished = true;

      clearTimeout(timeout);

      script.remove();

      delete window[callbackName];


      message.innerHTML =
        '<div class="error">' +
        '❌ Could not connect to attendance server.' +
        '</div>';


      document.getElementById(
        "submitButton"
      ).disabled = false;


      document.getElementById(
        "locationButton"
      ).disabled = false;

    };


  document.body.appendChild(script);

}


// =====================================================
// SERVICE WORKER
// =====================================================

if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker
        .register("service-worker.js")

        .then(function() {

          console.log(
            "Service Worker registered."
          );

        })

        .catch(function(error) {

          console.log(
            "Service Worker error:",
            error
          );

        });

    }
  );

}


</script>

</body>

</html>
